name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0点
  workflow_dispatch:
  push:
    branches:
      - main  

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: true
          TIME_RANGE: last_7_days
